name: Test Package

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package with test dependencies
        run: |
          uv pip install --system -e ".[test]"

      - name: Test import
        run: python -c "import ragu; print(ragu.__version__)"

      - name: Run tests
        run: |
          pytest tests/

  # Storage backends that need a server are exercised here. Without this job the
  # Neo4j adapter has no automated coverage at all: its tests skip themselves
  # when no server is reachable, so the matrix job above stays green either way.
  neo4j-integration:
    name: Neo4j integration
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install package with test and neo4j dependencies
        run: |
          uv pip install --system -e ".[test,neo4j]"

      - name: Run graph storage tests against a live Neo4j
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
        run: |
          pytest tests/storage/test_neo4j_adapter.py tests/storage/test_graph_contract.py

      - name: Fail if the suite silently skipped
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
        run: |
          pytest tests/storage/test_graph_contract.py -k neo4j -q --no-header -p no:cacheprovider \
            | tee /tmp/neo4j-run.txt
          grep -qE '[0-9]+ passed' /tmp/neo4j-run.txt
          if grep -qE '[0-9]+ skipped' /tmp/neo4j-run.txt; then
            echo "::error::Neo4j contract tests were skipped - the server was not reachable"
            exit 1
          fi

  mirror:
    name: Mirror to GitVerse
    needs: [test, neo4j-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitVerse
        env:
          GITVERSE_USERNAME: ${{ secrets.GITVERSE_USERNAME }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPO_URL: ${{ secrets.GITVERSE_REPO_URL }}
        run: |
          git remote add gitverse https://${GITVERSE_USERNAME}:${GITVERSE_TOKEN}@${GITVERSE_REPO_URL#https://}
          git push gitverse \
            +refs/heads/*:refs/heads/* \
            +refs/tags/*:refs/tags/*

